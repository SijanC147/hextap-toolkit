name: CI

on:
  push:
    branches:
      - main
  pull_request:

permissions:
  contents: read

jobs:
  windows-runner-temp:
    name: Windows runner temp
    runs-on: windows-2025
    steps:
      - name: Check out toolkit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          cache: false
          go-version-file: go.mod

      - name: Prove Git Bash runner temp handoff
        shell: bash
        run: |
          normalized_runner_temp="$(scripts/normalize-runner-temp.sh "$RUNNER_OS" "$RUNNER_TEMP")"
          mkdir "$normalized_runner_temp/validated-manifest"
          validated_manifest="$normalized_runner_temp/validated-manifest/project-manifest.json"
          cp examples/better-ccflare.json "$validated_manifest"
          expected_sha256="$(sha256sum "$validated_manifest" | cut -d ' ' -f 1)"
          scripts/verify-validated-manifest.sh "$validated_manifest" "$expected_sha256"
          {
            printf 'HEXTAP_RUNNER_TEMP=%s\n' "$normalized_runner_temp"
            printf 'VALIDATED_MANIFEST=%s\n' "$validated_manifest"
            printf 'EXPECTED_MANIFEST_SHA256=%s\n' "$expected_sha256"
          } >> "$GITHUB_ENV"

      - name: Execute through normalized Git Bash paths
        shell: bash
        run: |
          scripts/verify-validated-manifest.sh \
            "$VALIDATED_MANIFEST" "$EXPECTED_MANIFEST_SHA256"
          go build -trimpath -o "$HEXTAP_RUNNER_TEMP/hextapctl.exe" ./cmd/hextapctl
          "$HEXTAP_RUNNER_TEMP/hextapctl.exe" manifest validate --file "$VALIDATED_MANIFEST"

  verify:
    name: Toolkit
    needs: windows-runner-temp
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Require Windows runner temp proof
        env:
          WINDOWS_RUNNER_TEMP_RESULT: ${{ needs.windows-runner-temp.result }}
        run: |
          if [[ "$WINDOWS_RUNNER_TEMP_RESULT" != success ]]; then
            echo "::error title=Windows runner temp::hosted proof did not succeed" >&2
            exit 1
          fi

      - name: Check out toolkit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          cache: false
          go-version-file: go.mod

      - name: Set up Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: "1.3.14"

      - name: Prove Bun runtime cache and offline namespace
        run: |
          [[ "$(bun --version)" == 1.3.14 ]]
          proof_root="$(mktemp -d "$RUNNER_TEMP/hextap-bun-proof.XXXXXX")"
          trap 'find "$proof_root" -depth -delete' EXIT
          probe="$proof_root/probe.ts"
          printf '%s\n' 'console.log("hextap Bun runtime probe")' > "$probe"
          targets=(
            bun-linux-x64
            bun-linux-arm64
            bun-darwin-x64
            bun-darwin-arm64
            bun-windows-x64
          )

          empty_cache="$proof_root/empty-cache"
          mkdir "$empty_cache" "$proof_root/empty-output"
          if sudo -n unshare --net -- \
            sudo -n -u "$USER" env \
              HOME="$HOME" \
              PATH="$PATH" \
              BUN_INSTALL_CACHE_DIR="$empty_cache" \
              timeout 30 bun build "$probe" --compile --target=bun-windows-x64 \
                --outfile="$proof_root/empty-output/probe.exe"; then
            echo "empty cache unexpectedly compiled without network" >&2
            exit 1
          fi

          warm_cache="$proof_root/warm-cache"
          mkdir "$warm_cache" "$proof_root/warm-output" "$proof_root/offline-output"
          for target in "${targets[@]}"; do
            suffix=""
            [[ "$target" == bun-windows-x64 ]] && suffix=.exe
            BUN_INSTALL_CACHE_DIR="$warm_cache" bun build "$probe" --compile \
              --target="$target" \
              --outfile="$proof_root/warm-output/$target/probe$suffix"
          done
          expected_cache=(
            bun-darwin-aarch64-v1.3.14
            bun-darwin-x64-v1.3.14
            bun-linux-aarch64-v1.3.14
            bun-windows-x64-v1.3.14
          )
          mapfile -t actual_cache < <(find "$warm_cache" -mindepth 1 -maxdepth 1 \
            -type f -name 'bun-*-v1.3.14' -exec basename {} \; | LC_ALL=C sort)
          [[ "${actual_cache[*]}" == "${expected_cache[*]}" ]]

          for target in "${targets[@]}"; do
            suffix=""
            [[ "$target" == bun-windows-x64 ]] && suffix=.exe
            sudo -n unshare --net -- \
              sudo -n -u "$USER" env \
                HOME="$HOME" \
                PATH="$PATH" \
                BUN_INSTALL_CACHE_DIR="$warm_cache" \
                timeout 60 bun build "$probe" --compile --target="$target" \
                  --outfile="$proof_root/offline-output/$target/probe$suffix"
          done

      - name: Verify toolkit
        run: |
          test -z "$(gofmt -l .)"
          go test -count=1 ./...
          go test -race -count=1 ./...
          go vet ./...
          go build -trimpath ./...
          bash -n scripts/*.sh
          shellcheck scripts/*.sh
          git diff --exit-code

      - name: Install actionlint
        run: go install github.com/rhysd/actionlint/cmd/actionlint@v1.7.12

      - name: Check workflow schema
        run: scripts/check-actionlint.sh
